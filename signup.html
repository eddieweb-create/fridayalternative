<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Friday Alternative – Stay in the loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --pink:  #FF2D78;
      --pink2: #FF5599;
      --white: #F0EDE8;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Space Mono', monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
    }

    .content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      width: 100%; max-width: 420px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 0.15em;
      color: var(--white); margin-bottom: 2.5rem;
      text-shadow:
        0 0 6px rgba(255,45,120,0.9),
        0 0 20px rgba(255,45,120,0.5);
    }
    .logo span {
      color: var(--pink);
      text-shadow:
        0 0 6px rgba(255,45,120,1),
        0 0 25px rgba(255,45,120,0.7);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 18vw, 6rem);
      line-height: 0.88; letter-spacing: 0.03em;
      margin-bottom: 1rem;
    }

    h1 span { color: var(--pink); }

    p.sub {
      font-size: 0.75rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--white);
      margin-bottom: 2.5rem; line-height: 1.8;
    }

    .form-wrap { width: 100%; display: flex; flex-direction: column; gap: 0.85rem; }

    input[type="email"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1rem 1.25rem;
      color: var(--white);
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus { border-color: var(--pink); }
    input[type="email"]::placeholder { color: #888; }

    button {
      width: 100%;
      background: var(--pink);
      color: var(--black);
      border: none; cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem; letter-spacing: 0.1em;
      padding: 0.85rem 2rem;
      border-radius: 3px;
      transition: background 0.2s, transform 0.15s;
    }
    button:hover { background: var(--pink2); transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .note {
      font-size: 0.65rem; color: #444; letter-spacing: 0.08em;
      text-transform: uppercase; margin-top: 1rem;
    }

    /* Success state */
    .success {
      display: none;
      flex-direction: column; align-items: center; gap: 1rem;
    }
    .success h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 16vw, 5.5rem);
      line-height: 0.9; color: var(--pink);
      text-shadow:
        0 0 6px rgba(255,45,120,1),
        0 0 30px rgba(255,45,120,0.6);
    }
    .success p {
      font-size: 0.82rem; color: var(--white);
      letter-spacing: 0.08em; line-height: 1.8;
    }
    .success a {
      color: var(--pink); text-decoration: none;
      font-size: 0.72rem; letter-spacing: 0.12em;
      text-transform: uppercase; margin-top: 0.5rem;
      border-bottom: 1px solid var(--pink);
      padding-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="content">

    <div class="logo">The <span>Friday</span> Alternative</div>

    <!-- SIGNUP FORM -->
    <div id="signup-form">
      <h1>STAY IN<br><span>THE LOOP</span></h1>
      <p class="sub">Date announcements · Ticket links · Nothing else</p>
      <div class="form-wrap">
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email" />
        <button id="submit-btn" onclick="handleSignup()">I'M IN</button>
      </div>
      <p class="note">No spam. Unsubscribe any time.</p>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success" id="success">
      <h2>YOU'RE<br>IN.</h2>
      <p>We'll let you know when<br>the next date drops.</p>
      <a href="https://www.fridayalternative.club">← Back to the site</a>
    </div>

  </div>

  <script>
    async function handleSignup() {
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('email').focus();
        document.getElementById('email').style.borderColor = '#FF2D78';
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'HOLD ON...';

      try {
        const response = await fetch('https://formspree.io/f/maewzzvg', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        if (response.ok) {
          document.getElementById('signup-form').style.display = 'none';
          document.getElementById('success').style.display = 'flex';
        } else {
          btn.disabled = false;
          btn.textContent = "I'M IN";
          alert('Something went wrong — try again or find us on Instagram.');
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "I'M IN";
        alert('Something went wrong — try again or find us on Instagram.');
      }
    }

    document.getElementById('email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleSignup();
    });
  </script>
</body>
</html>
